<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWAG 行政平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Ctext x='16' y='22' font-size='17' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f5f6fa;--surface:#fff;--sunken:#f3f5f9;--line:#e6e9f0;--fg:#1b2233;--muted:#6b7488;--accent:#0f8a78;--accent-2:#14b8a6;--accent-soft:#e6f6f3;--danger:#d9485f;--danger-soft:#fdecef;--warn:#c47a0b;--warn-soft:#fff5e3;--done:#16a34a;--done-soft:#e8f7ee;--blue:#3b6fe0;--blue-soft:#eaf0fd;--violet:#7c5cd6;--violet-soft:#f1ecfc;--rose:#e0567a;--rose-soft:#fdeef3;--amber:#e09a1c;--amber-soft:#fff4df;--r:14px;--shadow:0 1px 2px rgba(20,30,60,.04),0 4px 14px rgba(20,30,60,.05);--hd:58px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.note{color:var(--muted);font-size:12.5px}
header{background:linear-gradient(120deg,#0b4f46 0%,#0f766e 55%,#13a08d 100%);position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(11,79,70,.18)}
.hd{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;min-height:var(--hd)}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px;color:#fff;letter-spacing:.3px;white-space:nowrap;border:0;background:none;padding:0}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#fff 0%,#c8f3ea 100%);display:inline-grid;place-items:center;color:#0f766e;font-style:normal;font-weight:800;font-size:15px}
nav{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;padding:7px 13px;border-radius:999px;color:rgba(255,255,255,.8);font-weight:500;white-space:nowrap;transition:background .15s}
nav button:hover{background:rgba(255,255,255,.12);color:#fff}
nav button[aria-current=true]{background:#fff;color:#0f766e;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.me{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.88);position:relative}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ffd27a,#f59e8b);color:#5a2a14;display:grid;place-items:center;font-size:12px;font-weight:700;box-shadow:0 0 0 2px rgba(255,255,255,.6);border:0;padding:0}
.menu{position:absolute;right:0;top:40px;background:#fff;color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,30,60,.15);padding:8px;min-width:220px;z-index:40}
.menu .who{padding:6px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;font-size:13px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px}
.menu button:hover{background:var(--sunken)}
main{max-width:1320px;margin:0 auto;padding:24px 16px 60px}
main.frame{max-width:none;padding:0}
.view-frame{display:block;width:100%;height:calc(100vh - var(--hd));border:0;background:var(--bg)}
.view-frame.with-sub{height:calc(100vh - var(--hd) - 56px)}
.frame-sub{height:56px;display:flex;align-items:center;max-width:1320px;margin:0 auto;padding:0 16px}
.frame-sub .subtabs{margin:0}
h2{font-size:20px;margin:0;letter-spacing:.2px}
.hello{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hello h2{font-size:22px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:10px;box-shadow:0 1px 1px rgba(20,30,60,.03);transition:border-color .15s;white-space:nowrap}
.btn:hover{border-color:#c9cfdc}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:linear-gradient(135deg,#0f8a78,#14b8a6);border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(15,138,120,.25)}
.btn.danger{color:var(--danger)}
.btn.small{padding:3px 10px;font-size:12.5px;border-radius:8px}
.btn.link{border:0;background:none;box-shadow:none;color:var(--accent);padding:2px 4px;font-weight:600}
.chip{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap;font-weight:500}
.chip.red{background:var(--danger-soft);color:var(--danger)}.chip.amber{background:var(--warn-soft);color:var(--warn)}.chip.green{background:var(--done-soft);color:var(--done)}.chip.teal{background:var(--accent-soft);color:var(--accent)}.chip.blue{background:var(--blue-soft);color:var(--blue)}.chip.violet{background:var(--violet-soft);color:var(--violet)}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mc,var(--accent))}
.card h3{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h3 .go{margin-left:auto;font-size:12.5px;color:var(--mc,var(--accent));border:0;background:none;font-weight:600}
.m-legal{--mc:var(--rose)}.m-doc{--mc:#0e7490}.k-doc{--mcs:#e0f2f7}
li.click{cursor:pointer;border-radius:6px}li.click:hover .t{color:var(--accent)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.person .ph{display:flex;align-items:center;gap:8px}.person .dot{width:10px;height:10px;border-radius:50%}
.load{height:5px;background:var(--sunken);border-radius:99px;overflow:hidden}.load i{display:block;height:100%;background:linear-gradient(90deg,#0f8a78,#14b8a6)}.m-contract{--mc:var(--blue)}.m-work{--mc:var(--accent)}.m-pt{--mc:var(--amber)}.m-asset{--mc:var(--violet)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;text-align:left}
button.kpi:hover{border-color:#c9cfdc}
.kpi .ic{grid-row:span 2;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--mcs,var(--accent-soft))}
.kpi b{font-size:24px;font-weight:700;line-height:1.1}.kpi b.red{color:var(--danger)}.kpi b.amber{color:var(--warn)}
.kpi span{font-size:12.5px;color:var(--muted)}
.k-legal{--mcs:var(--rose-soft)}.k-contract{--mcs:var(--blue-soft)}.k-work{--mcs:var(--accent-soft)}.k-pt{--mcs:var(--amber-soft)}.k-asset{--mcs:var(--violet-soft)}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
ul.plain li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline}
ul.plain li .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:#f8f9fc;white-space:nowrap;letter-spacing:.3px}
tr.click{cursor:pointer}tr.click:hover td{background:#f6faff}
tr:last-child td{border-bottom:0}
tr.done td{color:var(--muted)}tr.done .ttl{text-decoration:line-through}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input,.fld input,.fld select,.fld textarea{padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.filters input{min-width:220px}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(20,184,166,.35);border-color:var(--accent-2)}
.banner{background:linear-gradient(90deg,#eaf7f4,#f2faf8);border:1px solid #cdebe4;color:#0d5c51;border-radius:12px;padding:11px 15px;margin-bottom:16px;font-size:13px}
.banner.warn{background:linear-gradient(90deg,#fff4df,#fff9ee);border-color:#f3d9a6;color:#7d4f06}
.banner.err{background:var(--danger-soft);border-color:#f5c2cb;color:#9b1c33}
.drawer{position:fixed;inset:0;background:rgba(20,26,45,.38);backdrop-filter:blur(2px);display:flex;justify-content:flex-end;z-index:50}
.drawer .panel{background:var(--surface);width:min(560px,100%);height:100%;overflow:auto;padding:22px 24px;display:flex;flex-direction:column;gap:12px;box-shadow:-10px 0 30px rgba(20,30,60,.12)}
.drawer .panel.wide{width:min(760px,100%)}
.drawer .hdr{display:flex;align-items:center;gap:10px}.drawer .hdr h2{flex:1;font-size:18px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.fld>input,.fld>select,.fld>textarea{width:100%}
.fld input,.fld select,.fld textarea{color:var(--fg);font-size:14px}
.fld textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px}
.timeline{list-style:none;padding:0;margin:0;border-left:2px solid var(--line);margin-left:6px}
.timeline li{position:relative;padding:0 0 10px 18px;font-size:13px}
.timeline li::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--line);box-shadow:0 0 0 3px #fff}
.timeline li.past::before{background:var(--done)}.timeline li.next::before{background:var(--amber)}.timeline li.esc::before{background:var(--danger)}
.foot{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.foot .sp{flex:1}
.perm td,.perm th{text-align:center;padding:8px 8px}.perm td:first-child,.perm th:first-child{text-align:left}
.perm select{font-size:12.5px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:#fff}
.perm input{font-size:12.5px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);width:100%}
.perm select.v-管理,.perm select.v-正職,.perm select.v-是{color:var(--accent);font-weight:600}
.perm select.v-編輯,.perm select.v-PT{color:var(--blue)}
.perm select.v-部門{color:var(--warn);font-weight:600}
.perm select.v-—{color:#aab}
.perm tr.dirty td{background:#fffcf3}
.subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px}
.subtabs button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{padding:28px;text-align:center;color:var(--muted)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 500px at 20% -10%,#d6f3ec 0%,transparent 60%),radial-gradient(900px 500px at 110% 110%,#e6e8fb 0%,transparent 60%)}
.login .box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:36px 30px;width:min(400px,100%);text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center;box-shadow:0 20px 50px rgba(20,30,60,.10)}
.login .brand{color:var(--fg);font-size:20px}.login .brand i{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff}
#gbtn{min-height:44px}
.overlay-login{position:fixed;inset:0;z-index:100;background:rgba(245,246,250,.92)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1b2233;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.mailprev{width:100%;height:520px;border:1px solid var(--line);border-radius:12px;background:#fff}
.dl{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13.5px}
.dl dt{color:var(--muted)}.dl dd{margin:0}
@media (max-width:720px){.row2{grid-template-columns:1fr}.hd{gap:10px}.brand span{display:none}.filters input{min-width:0;flex:1}}
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <div class="box">
    <div class="brand"><i>S</i>SWAG 行政平台</div>
    <div class="note">工作台、PT 排班、合約庫、法務期限、設備資產<br>請使用 @swag.live 公司帳號登入</div>
    <div id="gbtn"></div>
    <div id="loginMsg" class="note" style="min-height:20px"></div>
  </div>
</div>

<div id="app" hidden>
  <header><div class="hd">
    <button class="brand" data-go="home"><i>S</i><span>SWAG 行政平台</span></button>
    <nav id="nav"></nav>
    <div class="me"><button class="av" id="avBtn" aria-label="帳號"></button>
      <div class="menu" id="menu" hidden></div></div>
  </div></header>
  <main id="main"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script src="js/pf.js"></script>
<script>
(function () {
"use strict";
const $ = s => document.querySelector(s);
const C = window.PF_CONFIG || {};
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => ymd(new Date());
const daysLeft = (d, t) => Math.round((new Date(d + "T00:00:00") - new Date((t || today()) + "T00:00:00")) / 86400000);
const showDate = d => { if (!d) return "—"; const [y, m, dd] = d.split("-"); return (y === String(new Date().getFullYear()) ? "" : y + "/") + Number(m) + "/" + Number(dd); };
const addDays = (d, n) => { const x = new Date(d + "T00:00:00"); x.setDate(x.getDate() + n); return ymd(x); };
const WD = "日一二三四五六";
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2800); }
function dayChip(d) {
  if (d == null || isNaN(d)) return '<span class="chip">—</span>';
  if (d < 0) return `<span class="chip red">逾期 ${-d} 天</span>`;
  if (d === 0) return '<span class="chip red">今天</span>';
  if (d <= 7) return `<span class="chip amber">剩 ${d} 天</span>`;
  if (d <= 30) return `<span class="chip blue">剩 ${d} 天</span>`;
  return `<span class="chip">剩 ${d} 天</span>`;
}

/* ================= 狀態 ================= */
let ME = null;           // {email,name,perm,isOwner,settings}
let view = "home";
const frames = {};       // 已載入的 iframe

const isFT = p => p.work === "正職";
const MODULES = [
  {id: "home", name: "首頁", show: () => true},
  {id: "work", name: p => isFT(p) ? "工作台" : "我的工作", show: p => p.work !== "—"},
  {id: "pt", name: "PT 排班", show: p => p.work !== "—"},
  {id: "sop", name: "SOP", show: p => p.work !== "—"},
  {id: "contracts", name: "合約庫", show: p => p.contracts !== "—"},
  {id: "docs", name: "函文", show: p => p.docs !== "—"},
  {id: "legal", name: "法務期限", show: p => p.legal !== "—"},
  {id: "assets", name: "設備資產", show: p => p.assets !== "—"},
  {id: "settings", name: "設定", show: p => p.isAdmin || isFT(p)},
  {id: "worksettings", hidden: true, parent: "settings", show: p => isFT(p)}
];
const allowed = id => { const m = MODULES.find(x => x.id === id); return !!(m && ME && m.show(ME.perm)); };
/* 工作台（同一個 iframe）裡各分頁對應的平台選單 */
const WORK_TAB = {work: "tasks", pt: "schedule", sop: "sop", worksettings: "settings"};
const TAB_VIEW = {tasks: "work", schedule: "pt", sop: "sop", settings: "worksettings", overview: "work"};

/* ================= 登入 ================= */
function showLogin(msg) {
  $("#app").hidden = true; $("#login").hidden = false;
  $("#loginMsg").innerHTML = msg || "";
  PF.renderButton($("#gbtn"), onCredential).catch(e => $("#loginMsg").textContent = e.message);
}
let loginWaiter = null;
async function onCredential(token) {
  $("#loginMsg").innerHTML = '<span class="spin"></span> 登入中…';
  try {
    const r = await PF.loginWithToken(token);
    if (r.denied) { $("#loginMsg").innerHTML = `<b>${esc(r.email)}</b> 尚未開通平台權限，請聯絡行政（Eva）。`; return; }
    ME = r.me;
    $("#login").hidden = true;
    // 已經在用平台、只是在背景更新 Google 登入（給設備資產用）：不要重畫畫面
    if (!loginWaiter && $("#app").dataset.ready) { $("#app").hidden = false; return; }
    if (loginWaiter) { const w = loginWaiter; loginWaiter = null; w(); if (!$("#app").hidden || $("#app").dataset.ready) { $("#app").hidden = false; return; } }
    startApp();
  } catch (e) { $("#loginMsg").textContent = e.message; }
}
// 使用中工作階段過期：跳出登入，登入後自動接著做
PF.setLoginHandler(resolve => { loginWaiter = resolve; showLogin("登入已過期，請重新登入，剛才的操作會自動繼續。"); });

async function boot() {
  if (!PF.hasSession()) return showLogin();
  try {
    ME = await PF.call("pf_apiMe");
    startApp();
  } catch (e) {
    if (!ME) showLogin(esc(e.message));
  }
}

function startApp() {
  $("#app").dataset.ready = "1";
  $("#app").hidden = false; $("#login").hidden = true;
  const ini = (ME.name || ME.email).replace(/^(.).*$/, "$1").toUpperCase();
  $("#avBtn").textContent = ini;
  const p = ME.perm, roles = [];
  if (p.work !== "—") roles.push("工作台：" + p.work);
  if (p.contracts !== "—") roles.push("合約庫：" + p.contracts + (p.contracts === "部門" ? "（" + p.depts.join("、") + "）" : ""));
  if (p.docs !== "—") roles.push("函文：" + p.docs);
  if (p.legal !== "—") roles.push("法務期限：" + p.legal);
  if (p.assets !== "—") roles.push("設備資產：" + p.assets);
  if (p.isAdmin) roles.push("平台管理員");
  $("#menu").innerHTML = `<div class="who"><b>${esc(ME.name)}</b><div class="note">${esc(ME.email)}</div><div class="note" style="margin-top:6px">${roles.map(esc).join("<br>")}</div></div>
    <button data-act="logout">登出</button>`;
  renderNav();
  route();
}

function renderNav() {
  const cur = (MODULES.find(m => m.id === view) || {}).parent || view;
  $("#nav").innerHTML = MODULES.filter(m => !m.hidden && m.show(ME.perm)).map(m => `<button data-go="${m.id}" aria-current="${m.id === cur}">${typeof m.name === "function" ? m.name(ME.perm) : m.name}</button>`).join("");
}

/* ================= 路由 ================= */
window.addEventListener("hashchange", route);
function go(id) { if (location.hash !== "#" + id) location.hash = id; else route(); }
function route() {
  if (!ME) return;
  let id = (location.hash || "#home").slice(1);
  if (id === "settings" && ME && !ME.perm.isAdmin && isFT(ME.perm)) id = "worksettings";
  if (!allowed(id)) id = "home";
  view = id;
  renderNav();
  const main = $("#main");
  const isFrame = id in WORK_TAB || id === "contracts" || id === "assets";
  main.className = isFrame ? "frame" : "";
  [...main.children].forEach(c => { if (c.tagName !== "IFRAME") c.remove(); });
  Object.values(frames).forEach(f => f.hidden = true);
  if (isFrame) return showFrame(id);
  const sec = document.createElement("section");
  main.appendChild(sec);
  ({home: renderHome, legal: renderLegal, docs: renderDocs, settings: renderSettings})[id](sec);
}

function showFrame(id) {
  const key = id in WORK_TAB ? "work" : id;
  let f = frames[key];
  if (!f) {

  }

  else f.classList.remove("with-sub");

}
/** 工作台、PT 排班、SOP、工作台設定都是同一個工作台 iframe：切換時叫它換分頁 */
function workTab(f, tab, taskId) {
  let n = 0;
  const go2 = () => {
    let w = null;
    try { w = f.contentWindow; } catch (e) {}
    if (w && w.__pf && w.__pf.ready()) {
      w.__pf.setTab(tab);
      if (taskId) w.__pf.openTask(taskId);
      return;
    }
    if (++n < 200) setTimeout(go2, 150);
  };
  go2();
}
/* 工作台裡自己切了分頁（例如點「今日 PT 檢核 ›」）：平台選單跟著換 */
window.__pfWorkTab = t => {
  const v = TAB_VIEW[t];
  if (!v || !(view in WORK_TAB) || v === view || (v === "work" && t === "overview" && view !== "work")) return;
  if (!allowed(v)) return;
  view = v;

};

const personName = e => { if (!e) return "未指定"; const p = (LG.people || []).find(x => x.email === e); return p ? p.name : e.split("@")[0]; };

}

/** 跟設備資產系統共用同一個登入（同網域，Supabase 的登入資料存在 localStorage） */
async function sbClient() {

  if (_sb) return _sb;
  if (!window.supabase) await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js");
  _sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, {auth: {persistSession: true, autoRefreshToken: false, detectSessionInUrl: false}});
  return _sb;
}
async function sbSession() {
  try { const sb = await sbClient(); if (!sb) return null; const {data: {session}} = await sb.auth.getSession(); return session ? sb : null; } catch (e) { return null; }
}
const ROLE2V = {admin: "管理", viewer: "檢視"}, V2ROLE = {"管理": "admin", "檢視": "viewer"};
/** 讀設備資產系統裡的管理員／唯讀名單 */
async function assetRoles() {
  const sb = await sbSession();
  if (!sb) return {nosession: true};
  const {data, error} = await sb.from("roles").select("email,role");
  if (error) return {error: error.message};
  return {rows: data || []};
}
/** 平台權限 → 設備資產系統：管理＝admin、檢視＝viewer、—＝移除（只動平台名單上的人） */
const assetCleared = new Set();   // 這次在設定頁手動改成「—」的人：只有這些人會從設備資產系統移除
async function syncAssetRoles(rows) {
  const cur = await assetRoles();
  if (cur.nosession) return "設備資產權限還沒同步：請先打開一次「設備資產」分頁登入，再回來按儲存。";
  if (cur.error) return "設備資產權限同步失敗：" + cur.error;
  const have = {}; cur.rows.forEach(r => have[r.email.toLowerCase()] = r.role);
  const ups = [], dels = [];
  rows.forEach(r => {
    const e = r.email.trim().toLowerCase(), want = V2ROLE[r.assets] || "";
    if (want && have[e] !== want) ups.push({email: e, role: want});
    if (!want && have[e] && assetCleared.has(e)) dels.push(e);
  });
  if (!ups.length && !dels.length) return "";
  const sb = await sbClient();
  if (ups.length) { const {error} = await sb.from("roles").upsert(ups, {onConflict: "email"}); if (error) return "設備資產權限同步失敗：" + error.message; }
  if (dels.length) { const {error} = await sb.from("roles").delete().in("email", dels); if (error) return "設備資產權限部分未同步（" + error.message + "）"; }
  assetCleared.clear();
  return "ok:設備資產權限已同步（" + (ups.length + dels.length) + " 人）";
}

/* ================= 設定 ================= */
let ST = null, stTab = "perm";
function settingsTabs(cur) {
  const t = [["perm", "權限"], ["heads", "部門主管與到期通知"], ["notify", "提醒設定"]].map(([k, n]) => `<button data-st="${k}" aria-current="${cur === k}">${n}</button>`);
  if (isFT(ME.perm)) t.push(`<button data-go="worksettings" aria-current="${cur === "work"}">工作台設定（成員、班別、週報、Slack）</button>`);
  return `<div class="subtabs">${t.join("")}</div>`;
}
async function renderSettings(sec) {
  sec.innerHTML = `<div class="toolbar"><h2>設定</h2></div>
    ${settingsTabs(stTab)}
    <div id="stBody"><div class="empty"><span class="spin"></span> 載入中…</div></div>`;
  sec.querySelector(".subtabs").onclick = e => { const b = e.target.closest("[data-st]"); if (b) { stTab = b.dataset.st; stRender(); } };
  try { ST = await PF.call("pf_apiPerms"); ST.settings = ME.settings || {}; } catch (e) { $("#stBody").innerHTML = `<div class="banner err">${esc(e.message)}</div>`; return; }
  stRender();
}
function stRender() {
  if (!$("#stBody")) return;
  document.querySelectorAll("[data-st]").forEach(b => b.setAttribute("aria-current", String(b.dataset.st === stTab)));
  ({perm: permTab, heads: headsTab, notify: notifyTab})[stTab]();
}
const OPT = (list, v) => list.map(x => `<option value="${esc(x)}"${x === v ? " selected" : ""}>${x === "" ? "—" : esc(x)}</option>`).join("");
let permDirty = false;

    ${unreg.length ? `<div class="banner warn">工作台成員還沒加進權限表：${unreg.map(m => `<button class="btn small" data-addm="${esc(m.email)}">＋ ${esc(m.name)}</button>`).join(" ")}</div>` : ""}

    <datalist id="deptList">${deptList}</datalist>
    <div id="assetSync"></div>

    <div class="note" style="margin-top:10px">系統擁有者（${esc(ST.owner)}）永遠有全部權限。函文：管理 = 可以登記、修改、刪除；檢視 = 只能看，但被指定為承辦人的那幾筆可以改狀態、加處理紀錄和附件。工作台：正職可管理全部，PT 只看排班、每日檢核和自己的工作。合約庫：管理 = 可改分類規則；編輯 = 可匯入、修改、上傳；檢視 = 只能看全部合約。</div>`;
  const rowHtml = (r, i) => `<tr data-i="${i}">

    <td><select data-k="work" class="v-${esc(r.work)}">${OPT(V.work, r.work)}</select></td>
    <td><select data-k="contracts" class="v-${esc(r.contracts)}">${OPT(V.contracts, r.contracts)}</select></td>

    <td>${r.email === ST.owner ? '<span class="note">擁有者</span>' : `<button class="btn small danger" data-rm="${i}">移除</button>`}</td></tr>`;
  const draw = () => {

  };
  draw();
  const dirty = () => { permDirty = true; $("#pmSave").disabled = false; };
  $("#pmQ").oninput = draw;
  $("#pmRows").oninput = e => {
    const el = e.target, tr = el.closest("tr[data-i]"); if (!tr || !el.dataset.k) return;

    if (el.dataset.k === "assets") { if (el.value === "—") assetCleared.add(r.email.toLowerCase()); else assetCleared.delete(r.email.toLowerCase()); }
    if (el.tagName === "SELECT") { el.className = "v-" + el.value; if (el.dataset.k === "contracts") { const d = tr.querySelector('[data-k="dept"]'); d.disabled = el.value !== "部門"; d.placeholder = el.value === "部門" ? "必填，例如 Marketing" : ""; if (el.value === "部門" && !d.value) d.focus(); } }
  };
  $("#stBody").onclick = e => {
    const rm = e.target.closest("[data-rm]");
    if (rm) { const gone = ST.rows.splice(+rm.dataset.rm, 1)[0]; if (gone && gone.assets !== "—") assetCleared.add(gone.email.toLowerCase()); draw(); dirty(); return; }
    const am = e.target.closest("[data-addm]");
    if (am) { const m = ST.members.find(x => x.email === am.dataset.addm); ST.rows.push({email: m.email, name: m.name, admin: "", work: m.type === "正職" ? "正職" : "PT", contracts: "—", legal: "—", assets: "—", docs: "—", dept: ""}); am.remove(); draw(); dirty(); return; }
  };
  if (C.SUPABASE_URL) assetRoles().then(cur => {
    const box = $("#assetSync"); if (!box) return;
    if (cur.nosession) { box.innerHTML = '<div class="banner warn">設備資產的權限會同步到設備資產系統。請先打開一次「設備資產」分頁登入，這裡才能讀寫它的管理員名單。</div>'; return; }
    if (cur.error) { box.innerHTML = `<div class="banner err">讀不到設備資產系統的權限：${esc(cur.error)}（只有設備資產的「管理」才能讀）</div>`; return; }
    const diff = cur.rows.filter(x => { const r = ST.rows.find(y => y.email === x.email.toLowerCase()); return !r || r.assets !== ROLE2V[x.role]; });
    const extra = ST.rows.filter(r => r.assets !== "—" && !cur.rows.some(x => x.email.toLowerCase() === r.email));
    if (!diff.length && !extra.length) { box.innerHTML = '<div class="note" style="margin:-6px 0 10px">✓ 設備資產權限和設備資產系統一致</div>'; return; }
    diff.forEach(x => { const e = x.email.toLowerCase(); let r = ST.rows.find(y => y.email === e); if (!r) { r = {email: e, name: "", admin: "", work: "—", contracts: "—", legal: "—", assets: "—", docs: "—", dept: ""}; ST.rows.push(r); } r.assets = ROLE2V[x.role]; });
    if (diff.length) { draw(); dirty(); }
    else if (extra.length) $("#pmSave").disabled = false;
    box.innerHTML = `<div class="banner warn">${diff.length ? `已依設備資產系統帶入 ${diff.length} 人的設備資產權限：${diff.map(x => esc(x.email.split("@")[0]) + "（" + ROLE2V[x.role] + "）").join("、")}。` : ""}${extra.length ? `有 ${extra.length} 人還沒同步到設備資產系統。` : ""}確認後按「儲存變更」，兩邊就會一致。</div>`;

}
